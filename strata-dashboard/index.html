<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OSCORP — Mine Safety Mission Control</title>
    
    <!-- Professional Modern Fonts: Plus Jakarta Sans, Inter, JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              earth: {
                base: '#F8F6F0',       // Warm parchment white
                surface: '#FFFFFF',    // Crisp white card surface
                elevated: '#F3EFE6',   // Soft warm stone elevation
                border: '#E6DFD5',     // Soft warm sand hairline border
                borderHover: '#D4C9BC',
                textMain: '#1F2421',   // Deep charcoal stone ink
                textMuted: '#6B685F',  // Warm taupe gray
                terracotta: '#C85A32', // Warm earthy rust/terracotta
                ochre: '#B8860B',      // Warm golden ochre
                olive: '#2E7D32',      // Deep forest/sage green (Safe)
                rust: '#B71C1C',       // Deep earthy red (Critical)
                cyan: '#0284C7'        // Tech slate blue
              }
            },
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', '"Inter"', 'system-ui', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'monospace']
            }
          }
        }
      }
    </script>
  </head>
  <body class="bg-[#F8F6F0] text-[#1F2421] antialiased min-h-screen selection:bg-[#C85A32] selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
